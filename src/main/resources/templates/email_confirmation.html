<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メールアドレス確認</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            font-family: "メイリオ", sans-serif;
            background-color: #f8f8f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
            background-color: #fff;
            border: 1px solid #000;
            padding: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 30px;
        }

        .form-table {
            width: 100%;
            border-collapse: collapse;
        }

        .form-table th,
        .form-table td {
            border: 1px solid #000;
            padding: 10px;
        }

        .form-table th {
            width: 30%;
            background-color: #f4f4f4;
            text-align: left;
        }

        input[type="text"],
        input[type="email"] {
            width: 95%;
            padding: 8px;
            font-size: 16px;
            border: 1px solid #000;
            border-radius: 4px;
        }

        .button-area {
            margin-top: 30px;
            text-align: center;
        }

        .list-button {
            background-color: #aaddff;
            border: 1px solid #000;
            padding: 10px 30px;
            font-size: 16px;
            font-weight: bold;
            margin-right: 20px;
            cursor: pointer;
        }

        .cancel-button {
            background-color: #ffdddd;
            border: 1px solid #000;
            padding: 10px 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .section-title {
            font-weight: bold;
            font-size: 18px;
            margin-top: 30px;
            margin-bottom: 10px;
            border-left: 5px solid #007acc;
            padding-left: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>メールアドレス確認</h1>

        <!-- エラーメッセージ表示エリア -->
        <div th:if="${errorMessage}" style="color: red; margin-bottom: 20px; font-weight: bold; text-align: center;">
            <p th:text="${errorMessage}"></p>
        </div>

        <form th:action="@{/course/registerList}" th:object="${checkForm}" method="post">

            <div class="section-title">登録情報の確認</div>
            <table class="form-table">
                <tr>
                    <th>代表者氏名</th>
                    <td>
                        <input type="text" th:field="*{userName}" placeholder="代表者の氏名を入力" required>
                    </td>
                </tr>
                <tr>
                    <th>メールアドレス</th>
                    <td>
                        <input type="email" th:field="*{email}" placeholder="example@mail.com" required>
                    </td>
                </tr>
            </table>

            <div class="button-area">
                <button type="submit" class="list-button">送信</button>
                <a type="button" class="cancel-button" href="/course/list">キャンセル</a>
            </div>

        </form>
    </div>
</body>

</html>
